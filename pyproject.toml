[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salus"
version = "0.1.0"
description = "Disaster Response Resource Consensus Network — Distributed consensus for emergency resource allocation across Incident Command Posts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Salus Team" }]

dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
    "rich>=13.7",

    # gRPC
    "grpcio>=1.64,<2",
    "grpcio-tools>=1.64,<2",
    "protobuf>=5.27,<6",

    # API
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=12.0,<13",

    # RAG & Embeddings
    "chromadb>=0.5,<1",
    "sentence-transformers>=3.0,<4",

    # LLM & Agents
    "langchain>=0.2,<1",
    "langchain-openai>=0.1,<1",
    "langgraph>=0.1,<1",

    # Utilities
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "aiofiles>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-timeout>=2.3,<3",
    "hypothesis>=6.103,<7",
    "ruff>=0.4,<1",
    "black>=24.4,<25",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<4",
    "docker>=7.1,<8",
]

[project.scripts]
salus-node = "salus.main:main"
salus-simulate = "simulation.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (requires Docker cluster)",
    "chaos: Chaos engineering tests (destructive, slow)",
]

[tool.coverage.run]
source = ["salus"]
omit = ["tests/*", "simulation/*"]
