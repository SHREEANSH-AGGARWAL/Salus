# Salus — 3-ICP Disaster Response Cluster
#
# Usage:
#   docker-compose up        — Start 3-ICP cluster
#   docker-compose up -d     — Start in background
#   docker-compose down -v   — Stop and remove volumes
#
# Ports:
#   ICP Alpha  (Fire Dept):  REST 8001, gRPC 50051
#   ICP Bravo  (EMS):        REST 8002, gRPC 50052
#   ICP Charlie (Military):  REST 8003, gRPC 50053

services:
  icp-alpha:
    build: .
    container_name: salus-icp-alpha
    hostname: icp-alpha
    environment:
      SALUS_NODE_ID: "node-alpha"
      SALUS_ICP_NAME: "ICP Alpha"
      SALUS_ICP_CODE: "ICP-A"
      SALUS_AGENCY_NAME: "Fire Department"
      SALUS_AGENCY_TYPE: "fire_department"
      SALUS_GRPC__PORT: "50051"
      SALUS_API__PORT: "8000"
      SALUS_PEERS: '[{"node_id": "node-bravo", "grpc_address": "icp-bravo:50051"}, {"node_id": "node-charlie", "grpc_address": "icp-charlie:50051"}]'
    ports:
      - "8001:8000"
      - "50051:50051"
    volumes:
      - icp-alpha-data:/app/data
    networks:
      - salus-network
    restart: unless-stopped

  icp-bravo:
    build: .
    container_name: salus-icp-bravo
    hostname: icp-bravo
    environment:
      SALUS_NODE_ID: "node-bravo"
      SALUS_ICP_NAME: "ICP Bravo"
      SALUS_ICP_CODE: "ICP-B"
      SALUS_AGENCY_NAME: "Emergency Medical Services"
      SALUS_AGENCY_TYPE: "ems"
      SALUS_GRPC__PORT: "50051"
      SALUS_API__PORT: "8000"
      SALUS_PEERS: '[{"node_id": "node-alpha", "grpc_address": "icp-alpha:50051"}, {"node_id": "node-charlie", "grpc_address": "icp-charlie:50051"}]'
    ports:
      - "8002:8000"
      - "50052:50051"
    volumes:
      - icp-bravo-data:/app/data
    networks:
      - salus-network
    restart: unless-stopped

  icp-charlie:
    build: .
    container_name: salus-icp-charlie
    hostname: icp-charlie
    environment:
      SALUS_NODE_ID: "node-charlie"
      SALUS_ICP_NAME: "ICP Charlie"
      SALUS_ICP_CODE: "ICP-C"
      SALUS_AGENCY_NAME: "NDRF 1st Battalion"
      SALUS_AGENCY_TYPE: "military"
      SALUS_GRPC__PORT: "50051"
      SALUS_API__PORT: "8000"
      SALUS_PEERS: '[{"node_id": "node-alpha", "grpc_address": "icp-alpha:50051"}, {"node_id": "node-bravo", "grpc_address": "icp-bravo:50051"}]'
    ports:
      - "8003:8000"
      - "50053:50051"
    volumes:
      - icp-charlie-data:/app/data
    networks:
      - salus-network
    restart: unless-stopped

volumes:
  icp-alpha-data:
  icp-bravo-data:
  icp-charlie-data:

networks:
  salus-network:
    driver: bridge
