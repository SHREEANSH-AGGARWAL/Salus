// Salus — Raft RPC Protocol Buffer Definitions
//
// INTERFACE CONTRACT (C1): This file defines all inter-ICP RPCs.
// S1 (leader election) and S2 (log replication) both depend on these schemas.
// Modify with caution — changes require both seniors to review.
//
// Reference: Ongaro & Ousterhout (2014), Figure 2 — RequestVote RPC and AppendEntries RPC

syntax = "proto3";

package salus.raft;

option java_multiple_files = true;

// ============================================================================
// Raft Consensus Service
// ============================================================================

service RaftService {
  // Leader election — §5.2
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Log replication — §5.3
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // Linearizable reads — §6.4 (ReadIndex optimization)
  rpc ReadIndex(ReadIndexRequest) returns (ReadIndexResponse);

  // Snapshot transfer — §7 (InstallSnapshot)
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);

  // Cluster health
  rpc Ping(PingRequest) returns (PingResponse);
}

// ============================================================================
// RequestVote RPC (§5.2)
// ============================================================================

message RequestVoteRequest {
  // Candidate's term
  int64 term = 1;

  // Candidate requesting vote
  string candidate_id = 2;

  // Index of candidate's last log entry
  int64 last_log_index = 3;

  // Term of candidate's last log entry
  int64 last_log_term = 4;
}

message RequestVoteResponse {
  // currentTerm, for candidate to update itself
  int64 term = 1;

  // true = candidate received vote
  bool vote_granted = 2;

  // ID of the node responding
  string voter_id = 3;
}

// ============================================================================
// AppendEntries RPC (§5.3)
// ============================================================================

message RaftLogEntry {
  int64 term = 1;
  int64 index = 2;
  string command_type = 3;     // CommandType enum value
  bytes payload = 4;            // JSON-serialized command
  int64 timestamp_unix_ms = 5;
}

message AppendEntriesRequest {
  // Leader's term
  int64 term = 1;

  // Leader ID — so followers can redirect clients
  string leader_id = 2;

  // Index of log entry immediately preceding new ones
  int64 prev_log_index = 3;

  // Term of prevLogIndex entry
  int64 prev_log_term = 4;

  // Log entries to store (empty for heartbeat)
  repeated RaftLogEntry entries = 5;

  // Leader's commitIndex
  int64 leader_commit = 6;
}

message AppendEntriesResponse {
  // currentTerm, for leader to update itself
  int64 term = 1;

  // true if follower contained entry matching prevLogIndex and prevLogTerm
  bool success = 2;

  // Responder's ID
  string follower_id = 3;

  // Optimization: follower's last log index (for faster catch-up)
  int64 match_index = 4;
}

// ============================================================================
// ReadIndex RPC (§6.4)
//
// Used by followers to serve linearizable reads without going through
// the leader's log. The follower asks the leader: "What is the current
// commit index?" Then waits until its own state machine has applied
// up to that index before serving the read.
// ============================================================================

message ReadIndexRequest {
  // The requesting node's ID
  string requester_id = 1;
}

message ReadIndexResponse {
  // The leader's current commit index
  int64 commit_index = 1;

  // The leader's current term
  int64 term = 2;

  // true if the responder is actually the leader
  bool is_leader = 3;

  // If not leader, redirect to this node
  string leader_id = 4;
}

// ============================================================================
// InstallSnapshot RPC (§7)
//
// Used when a follower is too far behind to catch up via log replay.
// The leader sends a snapshot of the state machine instead.
// Streamed in chunks for large snapshots.
// ============================================================================

message SnapshotChunk {
  // Leader's term
  int64 term = 1;

  // Leader's ID
  string leader_id = 2;

  // Last index included in the snapshot
  int64 last_included_index = 3;

  // Last term included in the snapshot
  int64 last_included_term = 4;

  // Byte offset of this chunk in the snapshot
  int64 offset = 5;

  // Chunk data
  bytes data = 6;

  // true if this is the last chunk
  bool done = 7;
}

message InstallSnapshotResponse {
  // currentTerm, for leader to update itself
  int64 term = 1;

  // true if snapshot was accepted
  bool success = 2;

  // Responder's ID
  string follower_id = 3;
}

// ============================================================================
// Health Check
// ============================================================================

message PingRequest {
  string sender_id = 1;
  int64 timestamp_unix_ms = 2;
}

message PingResponse {
  string responder_id = 1;
  string state = 2;              // "leader", "follower", "candidate"
  int64 current_term = 3;
  string leader_id = 4;
  int64 commit_index = 5;
  int64 last_log_index = 6;
  int64 timestamp_unix_ms = 7;
}
